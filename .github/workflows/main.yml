name: CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install Dependencies
      run: pip install -r experiment-20-cicd/requirements.txt

    - name: Run Tests
      run: pytest experiment-20-cicd

    - name: Build Docker Image
      run: docker build -t testing-backend ./experiment-20-cicd

    - name: Run Container
      run: docker run -d -p 5000:5000 testing-backend
